<!doctype html>
<html><head><meta charset="utf-8">

</style></head>
<body><div id="root"></div>
<script src="node_modules/three/build/three.min.js"></script>
<script src="room.js"></script>
<script>
const W = 1920, H = 1080;
const root = document.getElementById('root');
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ez = x => { x = cl(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const ap = (t, t0, d = .6) => ez((t - t0) / d);                 // 0→1 from t0 over d seconds
const el = (tag, css, html, parent) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; (parent || root).appendChild(e); return e; };
const svgNS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs, parent) => { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const STEPS = 9;

// ── shared chrome: progress bar + small brand ──
function chrome(idx) {
  idx = (window._curIdx || 1) - 1;
  el('div', 'left:60px;top:1030px;width:1800px;height:8px;border-radius:4px;background:#ece3d3;');
  const bar = el('div', 'left:60px;top:1030px;height:8px;border-radius:4px;background:linear-gradient(90deg,#f9a825,#4a148c);width:' + (1800 * (idx + 1) / STEPS) + 'px;');
  el('div', 'left:1000px;width:860px;text-align:right;top:986px;font-size:22px;color:#9a8c78;font-weight:600;', '💧 XKDG App · Water positions on a photo');
  [...root.children].forEach(c => c.classList.add('abs'));
}
// caption panel: step label, title, list of lines that appear at given times
function caption(x, y, w, step, title, lines) {
  const box = el('div', 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;');
  box.classList.add('abs');
  if (step) el('div', '', step, box).className = 'step';
  el('div', '', title, box).className = 'title';
  const body = el('div', '', '', box); body.className = 'body';
  const items = lines.map(l => { const d = el('div', 'margin-bottom:14px;', l[1], body); d.className = 'li'; return { d, t0: l[0] }; });
  return { box, update(t) { box.style.opacity = ap(t, 0, .5); items.forEach(it => { const a = ap(t, it.t0, .5); it.d.style.opacity = a; it.d.style.transform = 'translateY(' + (16 * (1 - a)) + 'px)'; }); } };
}
function fadeIO(t, dur) { root.style.opacity = Math.min(ap(t, 0, .45), 1 - ap(t, dur - .45, .45)); }

// ── phone with app screenshots ──
const IMGW = 824, IMGH = 1760;
function phone() {
  const fr = el('div', 'left:150px;top:46px;width:600px;height:960px;border-radius:64px;background:#1d1b26;box-shadow:0 30px 60px rgba(60,30,90,.25);');
  const scr = el('div', 'left:168px;top:64px;width:564px;height:924px;border-radius:48px;overflow:hidden;background:#fff;');
  const S = 564 / IMGW;
  const imgs = {};
  const ripple = el('div', 'width:70px;height:70px;border-radius:50%;border:6px solid #f9a825;background:rgba(249,168,37,.25);opacity:0;pointer-events:none;', '', scr);
  const hl = el('div', 'border:5px solid #f9a825;border-radius:14px;box-shadow:0 0 0 9999px rgba(30,10,50,.0);opacity:0;', '', scr);
  [fr, scr].forEach(c => c.classList.add('abs')); ripple.classList.add('abs'); hl.classList.add('abs');
  return {
    S,
    show(name, opacity, ty) {   // ty = image px scrolled off the top
      if (!imgs[name]) { const i = el('img', 'left:0;top:0;width:' + (IMGW * S) + 'px;opacity:0;', null, scr); i.src = 'shots/' + name + '.jpg'; i.classList.add('abs'); scr.insertBefore(i, ripple); imgs[name] = i; }
      const i = imgs[name]; i.style.opacity = opacity; i.style.transform = 'translateY(' + (-(ty || 0) * S) + 'px)';
    },
    tap(cx, cy, a, ty) {        // cx, cy in CSS px of the 412-wide page
      const x = cx * 2 * S, y = (cy * 2 - (ty || 0)) * S;
      const sc = .4 + .9 * a;
      ripple.style.opacity = a > 0 && a < 1 ? Math.sin(a * Math.PI) : 0;
      ripple.style.left = (x - 35) + 'px'; ripple.style.top = (y - 35) + 'px'; ripple.style.transform = 'scale(' + sc + ')';
    },
    highlight(x0, y0, x1, y1, a, ty) {   // image px
      hl.style.opacity = a; hl.style.left = (x0 * S - 6) + 'px'; hl.style.top = ((y0 - (ty || 0)) * S - 6) + 'px';
      hl.style.width = ((x1 - x0) * S + 2) + 'px'; hl.style.height = ((y1 - y0) * S + 2) + 'px';
    }
  };
}
// magnified callout of a screenshot region (image px)
function callout(x, y, w) {
  const box = el('div', 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;border-radius:22px;overflow:hidden;background:#fff;border:4px solid #f9a825;box-shadow:0 16px 36px rgba(60,30,90,.18);opacity:0;');
  box.classList.add('abs');
  return {
    set(name, x0, y0, x1, y1, a) {
      const s = w / (x1 - x0);
      box.style.height = ((y1 - y0) * s) + 'px';
      box.style.backgroundImage = 'url(shots/' + name + '.jpg)';
      box.style.backgroundSize = (IMGW * s) + 'px ' + (IMGH * s) + 'px';
      box.style.backgroundPosition = (-x0 * s) + 'px ' + (-y0 * s) + 'px';
      box.style.opacity = a; box.style.transform = 'scale(' + (.96 + .04 * a) + ')';
    }
  };
}
const META = __META__;

// ── window illustration (top view) ──
function windowArt(x, y, scale) {
  const s = sv('svg', { width: 1000 * scale, height: 820 * scale, viewBox: '0 0 1000 820' }, el('div', 'left:' + x + 'px;top:' + y + 'px;'));
  s.parentNode.classList.add('abs');
  const g = sv('g', {}, s);
  sv('rect', { x: 0, y: 0, width: 1000, height: 190, fill: '#dff1fb' }, g);
  sv('text', { x: 30, y: 50, 'font-size': 30, 'font-weight': 700, fill: '#5d8aa8', 'letter-spacing': 4 }, g).textContent = 'OUTSIDE';
  sv('rect', { x: 0, y: 190, width: 1000, height: 50, fill: '#6d6372' }, g);
  sv('rect', { x: 250, y: 200, width: 500, height: 30, fill: '#bfe7f7', stroke: '#5d8aa8', 'stroke-width': 3 }, g);
  sv('text', { x: 500, y: 222, 'font-size': 20, fill: '#2f5d78', 'text-anchor': 'middle', 'font-weight': 600 }, g).textContent = 'window frame / glass = the wall plane';

  sv('text', { x: 970, y: 285, 'font-size': 26, fill: '#a08a63', 'text-anchor': 'end', 'font-weight': 600 }, g).textContent = 'window sill';
  sv('rect', { x: 0, y: 440, width: 1000, height: 380, fill: '#f7f2ea' }, g);
  sv('text', { x: 30, y: 800, 'font-size': 30, 'font-weight': 700, fill: '#b9a98e', 'letter-spacing': 4 }, g).textContent = 'INSIDE';
  // sun + light
  const sun = sv('g', {}, g);
  sv('circle', { cx: 330, cy: 70, r: 38, fill: '#ffca28', stroke: '#f9a825', 'stroke-width': 6 }, sun);
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; sv('line', { x1: 330 + Math.cos(a) * 50, y1: 70 + Math.sin(a) * 50, x2: 330 + Math.cos(a) * 66, y2: 70 + Math.sin(a) * 66, stroke: '#f9a825', 'stroke-width': 6, 'stroke-linecap': 'round' }, sun); }
  const rays = sv('g', { opacity: 0 }, g);
  [[-60, 0], [0, 0], [60, 0]].forEach(([dx]) => sv('line', { x1: 360 + dx, y1: 110, x2: 440 + dx, y2: 356, stroke: '#ffb300', 'stroke-width': 5, 'stroke-dasharray': '14 10', opacity: .8 }, rays));
  // card
  const card = sv('g', {}, g);
  sv('rect', { x: 330, y: 240, width: 340, height: 290, fill: '#ffffff', stroke: '#9e9e9e', 'stroke-width': 3 }, card);
  sv('line', { x1: 330, y1: 241, x2: 670, y2: 241, stroke: '#4a148c', 'stroke-width': 6 }, card);
  const edgeLab = sv('text', { x: 680, y: 262, 'font-size': 22, fill: '#4a148c', 'font-weight': 700, opacity: 0 }, card); edgeLab.textContent = '← card edge flush';
  // tube / bottle (radius 2.5 cm = 25 px) at O; its shadow is a band; the pencil traces its LEFT EDGE
  const O = [500, 300], D = [Math.cos(72 * Math.PI / 180), Math.sin(72 * Math.PI / 180)], RT = 25;
  const N2 = [D[1], -D[0]];                                   // Edu: trace the edge NEAREST the reference (card) edge = the side the shadow leans to
  const E0 = [O[0] + N2[0] * RT, O[1] + N2[1] * RT], E1 = [O[0] - N2[0] * RT, O[1] - N2[1] * RT];
  const L = (530 - 6 - E0[1]) / D[1], L1 = (530 - 6 - E1[1]) / D[1];
  const shadow = sv('polygon', { points: [E0, [E0[0] + D[0] * L, E0[1] + D[1] * L], [E1[0] + D[0] * L1, E1[1] + D[1] * L1], E1].map(p => p.join(',')).join(' '), fill: 'rgba(60,50,70,.32)', opacity: 0 }, g);
  const traced = sv('line', { x1: E0[0], y1: E0[1], x2: E0[0], y2: E0[1], stroke: '#1d1b26', 'stroke-width': 4 }, g);
  const tExt = (E0[1] - 240) / D[1];
  const ext = sv('line', { x1: E0[0] - D[0] * tExt, y1: 240, x2: E0[0], y2: E0[1], stroke: '#1d1b26', 'stroke-width': 3, 'stroke-dasharray': '8 6', opacity: 0 }, g);
  // object: tube seen from above
  const obj = sv('g', { opacity: 0 }, g);
  sv('circle', { cx: O[0], cy: O[1], r: RT, fill: '#90a4ae', stroke: '#455a64', 'stroke-width': 4 }, obj);
  sv('circle', { cx: O[0], cy: O[1], r: RT - 9, fill: '#cfd8dc' }, obj);
  // pencil
  const pen = sv('g', { opacity: 0 }, g);
  sv('polygon', { points: '0,0 14,-8 70,-60 56,-74 4,-18', fill: '#ffb300', stroke: '#6d4c41', 'stroke-width': 3 }, pen);
  sv('polygon', { points: '0,0 14,-8 4,-18', fill: '#3e2723' }, pen);
  // protractor + alpha
  const prot = sv('g', { opacity: 0 }, g);
  const P0 = [E0[0] - D[0] * tExt, 240];
  sv('path', { d: `M${P0[0] - 140} 240 A140 140 0 0 0 ${P0[0] + 140} 240 Z`, fill: 'rgba(144,202,249,.25)', stroke: '#1e88e5', 'stroke-width': 3 }, prot);
  for (let k = 0; k <= 180; k += 10) { const a = k * Math.PI / 180; const r1 = k % 30 ? 128 : 118; sv('line', { x1: P0[0] + Math.cos(a) * r1, y1: 240 + Math.sin(a) * r1, x2: P0[0] + Math.cos(a) * 140, y2: 240 + Math.sin(a) * 140, stroke: '#1e88e5', 'stroke-width': 2 }, prot); }
  const arc = sv('path', { d: '', fill: 'none', stroke: '#e65100', 'stroke-width': 8, 'stroke-linecap': 'round' }, g);
  const alab = sv('text', { x: P0[0] + 120, y: 345, 'font-size': 44, 'font-weight': 800, fill: '#e65100', opacity: 0 }, g); alab.textContent = 'α = 72°';
  // viewer
  const viewer = sv('g', { opacity: 0 }, g);
  sv('ellipse', { cx: 500, cy: 720, rx: 70, ry: 30, fill: '#7e57c2' }, viewer);
  sv('circle', { cx: 500, cy: 712, r: 26, fill: '#f1c9a5', stroke: '#5d4037', 'stroke-width': 3 }, viewer);
  sv('line', { x1: 500, y1: 680, x2: 500, y2: 560, stroke: '#7e57c2', 'stroke-width': 4, 'stroke-dasharray': '10 8' }, viewer);
  sv('polygon', { points: '490,566 510,566 500,546', fill: '#7e57c2' }, viewer);
  sv('text', { x: 395, y: 730, 'font-size': 34, 'font-weight': 800, fill: '#9e9e9e', 'text-anchor': 'middle' }, viewer).textContent = 'L';
  const rLab = sv('text', { x: 605, y: 730, 'font-size': 34, 'font-weight': 800, fill: '#2e7d32', 'text-anchor': 'middle' }, viewer); rLab.textContent = 'R';
  const lean = sv('g', { opacity: 0 }, g);
  sv('path', { d: 'M640 600 Q 720 600 760 560', fill: 'none', stroke: '#2e7d32', 'stroke-width': 7, 'stroke-linecap': 'round' }, lean);
  sv('polygon', { points: '750,548 776,546 766,572', fill: '#2e7d32' }, lean);
  sv('text', { x: 790, y: 560, 'font-size': 36, 'font-weight': 800, fill: '#2e7d32' }, lean).textContent = 'RIGHT';
  return {
    g, s,
    set(o) {
      if (o.card != null) { card.setAttribute('transform', 'translate(0,' + (260 * (1 - o.card)) + ')'); card.setAttribute('opacity', o.card); edgeLab.setAttribute('opacity', o.edge || 0); }
      rays.setAttribute('opacity', o.rays || 0);
      obj.setAttribute('opacity', o.obj || 0); obj.setAttribute('transform', 'translate(0,' + (-40 * (1 - (o.obj || 0))) + ')');
      shadow.setAttribute('opacity', o.shadow || 0);
      const tr = o.trace || 0; traced.setAttribute('x2', E0[0] + D[0] * L * tr); traced.setAttribute('y2', E0[1] + D[1] * L * tr);
      pen.setAttribute('opacity', o.pen || 0); pen.setAttribute('transform', 'translate(' + (E0[0] + D[0] * L * tr) + ',' + (E0[1] + D[1] * L * tr) + ')');
      ext.setAttribute('opacity', o.ext || 0); prot.setAttribute('opacity', o.prot || 0);
      const aa = (o.arc || 0) * 72 * Math.PI / 180, R = 95;
      arc.setAttribute('d', (o.arc || 0) > 0 ? `M${P0[0] + R} 240 A${R} ${R} 0 0 1 ${P0[0] + Math.cos(aa) * R} ${240 + Math.sin(aa) * R}` : '');
      alab.setAttribute('opacity', o.alab || 0);
      viewer.setAttribute('opacity', o.viewer || 0); lean.setAttribute('opacity', o.lean || 0);
      if (o.zoom != null) { const z = 1 + .55 * o.zoom; g.setAttribute('transform', `translate(${500 * (1 - z) + 0},${(330) * (1 - z) + 40 * o.zoom}) scale(${z})`); }
    }
  };
}

// ── 3D window (three.js r149): card on the sill, vertical object, real cast shadow ──
function threeArt(x, y, w, h) {
  const host = el('div', 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;border-radius:24px;overflow:hidden;box-shadow:0 14px 34px rgba(60,30,90,.15);');
  host.classList.add('abs');
  const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  R.setPixelRatio(1); R.setSize(w, h); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFShadowMap;
  R.outputEncoding = THREE.sRGBEncoding;
  host.appendChild(R.domElement);
  const S = new THREE.Scene(); S.background = new THREE.Color('#cfe8f7');
  const cam = new THREE.PerspectiveCamera(38, w / h, 1, 2000);
  const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .85, metalness: 0 }, o || {}));
  const box = (sx, sy, sz, mat, px, py, pz, cast = true, recv = true) => { const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat); m.position.set(px, py, pz); m.castShadow = cast; m.receiveShadow = recv; S.add(m); return m; };
  // light: sun outside (−z), altitude 26.5°, shadow on the sill at 72° from the wall line, leaning to +x (right, seen from inside)
  const alt = 26.5 * Math.PI / 180, az = 72 * Math.PI / 180;
  const dir = new THREE.Vector3(Math.cos(az) * Math.cos(alt), -Math.sin(alt), Math.sin(az) * Math.cos(alt));
  S.add(new THREE.HemisphereLight(0xeef4ff, 0xc9b79a, .6));
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.5);
  sun.position.copy(dir.clone().multiplyScalar(-400)); sun.target.position.set(0, 0, 10); S.add(sun.target);
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
  Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, near: 200, far: 650 }); sun.shadow.bias = -0.0006; sun.shadow.radius = 3;
  S.add(sun);
  // wall (interior face at z = 0), opening x −55..55, y 0..115; glass plane at z = −2
  const wallM = M('#ece6dc'), frameM = M('#ffffff', { roughness: .5 });
  box(80, 230, 30, wallM, -95, 55, -15); box(80, 230, 30, wallM, 95, 55, -15);
  box(110, 60, 30, wallM, 0, 145, -15); box(270, 80, 30, wallM, 0, -42, -15, true, true);
  box(400, 300, 4, wallM, 0, -152, 0.5);                    // interior wall below the sill
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), M('#efe6d6')); floor.rotation.x = -Math.PI / 2; floor.position.set(0, -110, 300); floor.receiveShadow = true; S.add(floor);
  // frame + glass
  box(6, 115, 8, frameM, -52, 57.5, -2); box(6, 115, 8, frameM, 52, 57.5, -2); box(110, 6, 8, frameM, 0, 112, -2);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(104, 110), new THREE.MeshStandardMaterial({ color: 0xbfe7ff, transparent: true, opacity: .18, roughness: .05 }));
  glass.position.set(0, 57, -2); S.add(glass);
  // sill (top at y = 0), from the glass inward
  box(130, 4, 34, M('#d9c19a', { roughness: .7 }), 0, -2, 15, false, true);
  // outside: a far ground + soft sky
  const gr = new THREE.Mesh(new THREE.PlaneGeometry(2000, 1200), M('#b9d6a3')); gr.rotation.x = -Math.PI / 2; gr.position.set(0, -60, -650); S.add(gr);
  // card (34 × 26 cm, edge on the glass line z = 2)
  const card = new THREE.Group(); S.add(card);
  const cardM = new THREE.Mesh(new THREE.BoxGeometry(34, .4, 26), M('#ffffff', { roughness: .95 })); cardM.position.set(0, .2, 13); cardM.receiveShadow = true; cardM.castShadow = true; card.add(cardM);
  const edge = new THREE.Mesh(new THREE.BoxGeometry(34, .5, .8), new THREE.MeshBasicMaterial({ color: 0x4a148c })); edge.position.set(0, .45, .4); card.add(edge);
  // vertical object: a tube (r 2.5 cm, 30 cm tall) at x = 0, z = 6 — its shadow has two clean parallel edges
  const book = new THREE.Group(); S.add(book);
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 30, 48), M('#90a4ae', { roughness: .5 })); tube.position.y = 15; tube.castShadow = true; book.add(tube);
  const rim = new THREE.Mesh(new THREE.RingGeometry(1.6, 2.5, 48), M('#546e7a')); rim.rotation.x = -Math.PI / 2; rim.position.y = 30.05; book.add(rim);
  book.position.set(0, .4, 6);
  // traced pencil line = the LEFT EDGE of the shadow: starts at the tangent point of the tube base
  const shDir = new THREE.Vector3(Math.cos(az), 0, Math.sin(az));
  const nL = new THREE.Vector3(shDir.z, 0, -shDir.x);          // the edge nearest the card edge (side the shadow leans to)
  const E0 = new THREE.Vector3(nL.x * 2.5, 0, 6 + nL.z * 2.5);
  const Lmax = (26 - 0.5 - E0.z) / shDir.z;
  const line = new THREE.Mesh(new THREE.BoxGeometry(1, .15, .35), new THREE.MeshBasicMaterial({ color: 0x1d1b26 }));
  line.rotation.y = -Math.atan2(shDir.z, shDir.x); S.add(line);
  // pencil
  const pen = new THREE.Group(); S.add(pen);
  const pb = new THREE.Mesh(new THREE.CylinderGeometry(.55, .55, 16, 12), M('#ffb300')); pb.position.y = 9; pen.add(pb);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(.55, 2, 12), M('#3e2723')); tip.rotation.x = Math.PI; tip.position.y = 1; pen.add(tip);
  pen.rotation.z = -.45; pen.rotation.x = .25;
  pen.traverse(o => { if (o.isMesh) o.castShadow = true; });
  // labels (HTML, follow 3D points)
  const lab = (txt, col) => { const d = el('div', 'font-size:26px;font-weight:800;color:' + col + ';background:rgba(255,255,255,.88);border-radius:10px;padding:4px 12px;white-space:nowrap;opacity:0;transform:translate(-50%,-100%);', txt, host); d.classList.add('abs'); return d; };
  const L1 = lab('card edge flush with the glass', '#4a148c'), L2 = lab('a tube or a bottle', '#37474f'), L3 = lab('its shadow', '#37474f'), L4 = lab('☀️ sun from outside', '#e65100');
  const place = (d, v, a) => { const p = v.clone().project(cam); d.style.left = ((p.x + 1) / 2 * w) + 'px'; d.style.top = ((1 - p.y) / 2 * h) + 'px'; d.style.opacity = a; };
  const lerp = (a, b, k) => a + (b - a) * k;
  return {
    set(o) {
      // camera: inside, high, to the left → slow orbit → straight above (top view, outside up)
      const k = o.cam || 0, up = o.top || 0;
      const ang = lerp(-0.55, -0.25, k);
      const pos = new THREE.Vector3(Math.sin(ang) * 135, lerp(88, 70, k), Math.cos(ang) * 135 + 8);
      const topPos = new THREE.Vector3(0.001, 120, 14);
      cam.position.set(lerp(pos.x, topPos.x, up), lerp(pos.y, topPos.y, up), lerp(pos.z, topPos.z, up));
      cam.up.set(0, 1, 0).lerp(new THREE.Vector3(0, 0, -1), up).normalize();
      cam.lookAt(0, 0, lerp(10, 14, up));
      const c = o.card || 0;
      card.position.set(0, (1 - c) * 26, (1 - c) * 18); card.visible = c > 0;
      const b = o.obj || 0;
      book.position.y = .4 + (1 - b) * 30; book.visible = b > 0;
      sun.intensity = 1.5 * (o.sunOn == null ? 1 : o.sunOn);
