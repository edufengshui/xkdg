<title>Schede natali He Luo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
/* layout: una colonna di schede, ogni scheda = griglia esagrammi + tabelle numeri */
:root{--bg:#f6f5f1;--card:#fff;--fg:#1f2226;--mut:#6b6f76;--line:#dcdad3;--ink:#7a1f1f;--yang:#1f2226;--good:#2e6b3a;--bad:#a3372b;
--disp:"Noto Serif SC",serif;--body:"Source Sans 3",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#202225;--fg:#e8e6e1;--mut:#9a9ea5;--line:#34373b;--ink:#e0857a;--yang:#e8e6e1;--good:#7cc08a;--bad:#ef8a7e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#202225;--fg:#e8e6e1;--mut:#9a9ea5;--line:#34373b;--ink:#e0857a;--yang:#e8e6e1;--good:#7cc08a;--bad:#ef8a7e;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--disp);font-size:24px;margin:0;text-wrap:balance}
.intro{color:var(--mut);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.code{font-family:var(--disp);font-size:22px;color:var(--ink)}
.sex{color:var(--mut);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.bazi{display:flex;gap:14px}
.bazi div{text-align:center}.bazi small{display:block;font-size:11px;color:var(--mut)}
.bazi b{font-family:var(--disp);font-size:22px;line-height:1.15;display:block}
.hexes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.hx{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;min-width:0}
.hx .t{font-size:11px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.hx .n{font-weight:600}
.hx .nm{color:var(--mut);font-size:11.5px}
.hx.main .n{color:var(--ink);font-size:14px}
table{border-collapse:collapse;font-size:13px;width:100%}
td,th{padding:3px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ok{color:var(--good)}.no{color:var(--bad)}
.tw{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two>*{min-width:0}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.judge{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.judge select,.judge input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.judge input{flex:1;min-width:0}
button{font:inherit;font-weight:600;padding:8px 14px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--card);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#out{width:100%;min-height:90px;font-family:var(--mono);font-size:12px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px}
.sec{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:0}
</style>
<div class="wrap">
<h1>Schede natali He Luo Li Shu</h1>
<p class="intro">12 persone, codici S01–S12, senza nomi né eventi. Metodo A (app: anno dal solstizio d'inverno, Na Jia, tempo solare vero). Per ognuna: grado di fortuna di vita da −2 a +2 e una nota. In fondo, "Copia giudizi" e incollali in chat.</p>
<div id="list" style="display:flex;flex-direction:column;gap:18px"></div>
<div class="card"><p class="sec">Giudizi</p><button id="copy" type="button">Copia giudizi</button><textarea id="out" readonly></textarea></div>
</div>
<script>
const S=__DATA__;
const CN={Qian:'乾',Dui:'兌',Li:'離',Zhen:'震',Xun:'巽',Kan:'坎',Gen:'艮',Kun:'坤'};
const tri=t=>t?t+' '+CN[t]:'—';
function svg(lines,mv,w){w=w||56;const h=6*11;let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
 for(let i=0;i<6;i++){const y=h-(i+1)*11+2,c=(mv===i+1)?'var(--ink)':'var(--yang)';
  if(lines[i]==='1')s+=`<rect x="0" y="${y}" width="${w}" height="7" fill="${c}"/>`;
  else s+=`<rect x="0" y="${y}" width="${w*0.42}" height="7" fill="${c}"/><rect x="${w*0.58}" y="${y}" width="${w*0.42}" height="7" fill="${c}"/>`;}
 return s+'</svg>';}
const nm=t=>(t||'').replace(/^[^–-]*[–-]\s*/,'');
function hx(t,h,mv,main){if(!h)return'';return `<div class="hx${main?' main':''}"><span class="t">${t}</span>${svg(h.lines,mv,main?64:48)}<span class="n">${h.n}${mv?' · l'+mv:''}</span><span class="nm">${tri(h.upper)} / ${tri(h.lower)}</span><span class="nm">${nm(h.name)}</span></div>`;}
const yn=b=>b==null?'—':b?'<span class="ok">sì</span>':'<span class="no">no</span>';
const sg=x=>(x>=0?'+':'')+x;
const has=(h,t)=>h&&(h.upper===t||h.lower===t);
function cyc(c){return c.map(x=>`<tr><td class="num">l${x.line}</td><td>${x.yang?'yang 9':'yin 6'}</td><td class="num">${x.from}–${x.to}</td></tr>`).join('');}
let J={};try{J=JSON.parse(localStorage.getItem('hl-judge')||'{}')}catch(e){}
document.getElementById('list').innerHTML=S.map(s=>{const N=s.numbers,L=s.luck;
 const lk=[['Cielo (stelo anno)',L.heaven,L.opposite.heaven],['Terra (ramo anno)',L.earth,L.opposite.earth],['Fama (stagione)',L.fame,L.opposite.fame]]
  .map(r=>`<tr><td>${r[0]}</td><td>${tri(r[1])}</td><td>${has(s.xt,r[1])?'XT ':''}${has(s.ht,r[1])?'HT':''}</td><td>${tri(r[2])}</td><td>${has(s.xt,r[2])?'XT ':''}${has(s.ht,r[2])?'HT':''}</td></tr>`).join('');
 return `<article class="card" id="${s.code}">
 <div class="head"><span class="code">${s.code}</span><span class="sex">${s.sex==='M'?'uomo':'donna'} · ${s.dun} · ${s.season}</span></div>
 <div class="bazi">${[['Ora',s.bazi.ora],['Giorno',s.bazi.giorno],['Mese',s.bazi.mese],['Anno He Luo',s.bazi.anno]].map(c=>`<div><small>${c[0]}</small><b>${c[1][0]}<br>${c[1][1]}</b></div>`).join('')}</div>
 <div class="hexes">${hx('Xian Tian 先天',s.xt,s.mv,1)}${hx('Hou Tian 後天'+(s.ht&&s.ht.rule==='special'?' (spec.)':''),s.ht,s.ht&&s.ht.line,1)}${hx('Hu Gua XT',s.huXT)}${hx('Hu Gua HT',s.huHT)}${hx('Opposto XT',s.oppXT)}${hx('Inverso XT',s.invXT)}${hx('Opposto HT',s.oppHT)}${hx('Inverso HT',s.invHT)}</div>
 <div class="two">
  <div class="tw"><table>
   <tr><th>Numeri</th><th></th><th>equilibrio</th></tr>
   <tr><td>Cielo (yang)</td><td class="num">${N.heaven}</td><td class="num">25 · ${sg(N.devHeaven)}</td></tr>
   <tr><td>Terra (yin)</td><td class="num">${N.earth}</td><td class="num">30 · ${sg(N.devEarth)}</td></tr>
   <tr><td>Totale</td><td class="num">${N.total}</td><td class="num">55 · ${sg(N.total-55)}</td></tr>
   <tr><td>Media mese ${N.monthAvg.month}</td><td colspan="2" class="num">yang ${N.monthAvg.yang} · yin ${N.monthAvg.yin}</td></tr>
   <tr><td>Trigrammi</td><td colspan="2">Cielo ${tri(s.heaven)}${s.five?' (5 · ciclo '+s.five+')':''} · Terra ${tri(s.earth)} · Cielo ${s.heavenUp?'sopra':'sotto'}</td></tr>
  </table></div>
  <div class="tw"><table>
   <tr><th></th><th>XT l${s.mv}</th><th>HT l${s.ht?s.ht.line:'—'}</th></tr>
   <tr><td>Proper position</td><td>${yn(s.posXT)}</td><td>${yn(s.posHT)}</td></tr>
   <tr><td>Proper support</td><td>${yn(s.supXT)}</td><td>${yn(s.supHT)}</td></tr>
   <tr><td>Prevalenza</td><td>${s.prevXT||'—'}</td><td>${s.prevHT||'—'}</td></tr>
  </table></div>
 </div>
 <div class="tw"><table><tr><th>Trigramma di fortuna</th><th></th><th>in</th><th>opposto</th><th>in</th></tr>${lk}</table></div>
 <div class="two">
  <div class="tw"><table><tr><th colspan="3">Cicli XT (età)</th></tr>${cyc(s.cXT)}</table></div>
  <div class="tw"><table><tr><th colspan="3">Cicli HT (età)</th></tr>${cyc(s.cHT)}</table></div>
 </div>
 <div class="judge"><label for="g-${s.code}" class="sec">Giudizio</label>
  <select id="g-${s.code}" data-c="${s.code}"><option value="">—</option>${[2,1,0,-1,-2].map(v=>`<option value="${v}"${J[s.code]&&J[s.code].g==String(v)?' selected':''}>${sg(v)}</option>`).join('')}</select>
  <input id="n-${s.code}" data-c="${s.code}" placeholder="nota" value="${(J[s.code]&&J[s.code].n||'').replace(/"/g,'&quot;')}"></div>
 </article>`;}).join('');
function upd(){S.forEach(s=>{J[s.code]={g:document.getElementById('g-'+s.code).value,n:document.getElementById('n-'+s.code).value}});
 try{localStorage.setItem('hl-judge',JSON.stringify(J))}catch(e){}
 document.getElementById('out').value=S.map(s=>`${s.code} ${J[s.code].g===''?'?':sg(+J[s.code].g)} ${J[s.code].n}`).join('\n');}
document.addEventListener('input',upd);document.addEventListener('change',upd);upd();
document.getElementById('copy').onclick=()=>{const t=document.getElementById('out');navigator.clipboard.writeText(t.value).then(()=>{copy.textContent='Copiati'},()=>{t.select()})};
</script>
